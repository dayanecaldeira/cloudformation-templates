AWSTemplateFormatVersion: '2010-09-09'
Description: Create a bastion host for secure access to private resources

Parameters:
  MyKeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: ec2-key-pair
    Description: Name of an existing EC2 KeyPair to enable SSH access to the bastion

Resources:
  SystemVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.1.0.0/16
      Tags:
        - Key: Name
          Value: SystemVPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: SystemIGW

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref SystemVPC
      InternetGatewayId: !Ref InternetGateway
  
  PublicSubnet1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SystemVPC
      CidrBlock: 10.1.1.0/24
      AvailabilityZone: "us-east-1a"
      Tags:
        - Key: Name
          Value: public_subnet_1a

  PrivateSubnet1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SystemVPC
      CidrBlock: 10.1.2.0/24
      AvailabilityZone: "us-east-1a"
      Tags:
        - Key: Name
          Value: private_subnet_1a

  PublicRouteTable1a:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SystemVPC
      Tags:
        - Key: Name
          Value: public_route_table_1a

  PrivateRouteTable1a:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SystemVPC
      Tags:
        - Key: Name
          Value: private_route_table_1a

  PublicSubnetRouteTableAssociation1a:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1a
      RouteTableId: !Ref PublicRouteTable1a

  PrivateRouteTableAssociation1a:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1a
      RouteTableId: !Ref PrivateRouteTable1a

  PublicInternetRoute1a:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable1a
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SystemSecurityGroupPublic:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH access to bastion host
      VpcId: !Ref SystemVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: BastionSecurityGroup

  SystemSecurityGroupPrivate:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH access to private instances from bastion host
      VpcId: !Ref SystemVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref SystemSecurityGroupPublic
      Tags:
        - Key: Name
          Value: PrivateSecurityGroup

  NatGatewayEIP:
    Type: "AWS::EC2::EIP"
    Properties:
      Domain: vpc

  SystemNATGateway:
    Type: "AWS::EC2::NatGateway"
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1a

  PrivateRouteNATGateway:
    Type: "AWS::EC2::Route"
    Properties:
      RouteTableId: !Ref PrivateRouteTable1a
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref SystemNATGateway

  BastionEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0532be01f26a3de55
      InstanceType: t2.micro
      KeyName: !Ref MyKeyPairName
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: "0"
          GroupSet:
            - !Ref SystemSecurityGroupPublic
          SubnetId: !Ref PublicSubnet1a
      Tags:
        - Key: Name
          Value: bastion_ec2_webserver

  PrivateEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0532be01f26a3de55
      InstanceType: t2.micro
      SubnetId: !Ref PrivateSubnet1a
      KeyName: !Ref MyKeyPairName
      SecurityGroupIds:
        - !Ref SystemSecurityGroupPrivate
      Tags:
        - Key: Name
          Value: private_instance